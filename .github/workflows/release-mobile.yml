name: Release Mobile

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Mobile X.Y.Z version; builds artifacts only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Verify release source
        if: github.event_name == 'push'
        shell: bash
        run: git merge-base --is-ancestor HEAD origin/main
      - id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          value="${REQUESTED:-${GITHUB_REF_NAME#mobile-v}}"
          [[ "$value" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          build_number=$(($(date +%s) - 1577836800))
          (( build_number > 0 && build_number <= 2147483647 ))
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    defaults:
      run:
        working-directory: .
    runs-on: ubuntu-latest
    env:
      MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload and dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          sudo dotnet workload install maui-android --skip-manifest-update
          dotnet build src/Quantum.Mobile/Quantum.Mobile.csproj -f net10.0-android -t:InstallAndroidDependencies -p:QuantumMobileTargetFramework=net10.0-android -p:AcceptAndroidSdkLicenses=true -p:AndroidSdkDirectory=$env:ANDROID_HOME
      - name: Prepare signing key
        shell: pwsh
        env:
          KEYSTORE: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE -or !$env:MOBILE_ANDROID_KEYSTORE_PASSWORD) { throw 'Persistent Android signing credentials are required.' }
          $path = Join-Path $env:RUNNER_TEMP 'quantum-mobile.p12'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE))
          "MOBILE_ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
      - name: Publish signed APK
        shell: pwsh
        run: ./.ci/Build-MobileRelease.ps1 -Version '${{ needs.prepare.outputs.version }}' -Target android -BuildNumber ${{ needs.prepare.outputs.build_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          include-hidden-files: true
          path: artifacts/mobile-delivery/android/*
          if-no-files-found: error
      - name: Remove signing key from runner
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'quantum-mobile.p12'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path }

  windows:
    needs: prepare
    defaults:
      run:
        working-directory: .
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workload
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Test mobile logic
        run: dotnet test .ci/Quantum.Mobile.Checks.slnx -c Release
      - name: Publish portable Windows client
        shell: pwsh
        run: ./.ci/Build-MobileRelease.ps1 -Version '${{ needs.prepare.outputs.version }}' -Target win-x64 -BuildNumber ${{ needs.prepare.outputs.build_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-x64
          include-hidden-files: true
          path: artifacts/mobile-delivery/win-x64/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [prepare, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/mobile-delivery
      - name: Verify and publish complete release
        run: python .ci/publish-client-release.py
